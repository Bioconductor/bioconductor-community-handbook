name: Quarto render

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    name: Quarto render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render handbook
        run: quarto render

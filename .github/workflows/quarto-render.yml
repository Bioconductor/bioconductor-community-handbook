# adapted from https://github.com/quarto-dev/quarto-actions/blob/main/examples/quarto-publish-example.yml

on:
  pull_request:
    branches:
      - main

name: Test Render

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

project:
  type: book

book:
  announcement:
    icon: info-circle
    dismissable: true
    content: "**Something to share? Something missing?** Everyone is welcome to contribute to this handbook. Find out how in our [contribution guide](get_involved/contributing_to_handbook.qmd)."
  title: "Bioconductor All‑Community Handbook"
  favicon: images/favicon.ico
  cover-image: images/bach_logo.png
  cover-image-alt: 'A closed music book titled BACH rests on a music stand. Its cover features the Bioconductor logo: a blue musical note whose stem extends into a horizontal DNA double helix formed by blue and green dots.'
  repo-url: https://github.com/Bioconductor/bioconductor-community-handbook
  repo-branch: main
  repo-actions: [edit, issue, source]
  repo-link-target: _blank
  author:
    - name: "The Bioconductor Community"
      url: https://bioconductor.org
  date: today
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: guide_software.qmd
      chapters:
        - guides/software/package_development.qmd
        - guides/software/package_maintenance.qmd
        - guides/software/package_peer_review.qmd
    - part: guide_communication.qmd
      chapters:
        - guides/communication/community_channels.qmd
        - guides/communication/using_ai.qmd
        - guides/communication/using_the_zulip_chat.qmd
        - guides/communication/communicating_with_package_authors.qmd
        - guides/communication/communicating_with_other_communities.qmd
    - part: guide_fair.qmd
      chapters:
        - guides/fair/interoperable_file_types.qmd
        - guides/fair/bioc_in_galaxy.qmd
        - guides/fair/bioc_in_nfcore.qmd
    - part: code_of_conduct.md
      chapters:
        - code_of_conduct/en-US.qmd
        - code_of_conduct/fr-FR.qmd
    - part: get_involved.md
      chapters:
        - get_involved/contributing_to_handbook.qmd
        - get_involved/community_roles.qmd
    - references.qmd
  appendices:
    - appendices/contributors.qmd
    - appendices/definitions.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - custom.scss
